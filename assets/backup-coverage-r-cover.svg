<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Two-cover backup coverage</title>
  <desc id="desc">Demand point D1 is within the service threshold of two selected facilities F1 and F2. Demand point D2 is within threshold of F2 only, so it has ordinary coverage but no backup coverage.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#666"/></marker></defs>
  <rect x="20" y="20" width="860" height="380" rx="18" fill="#f7f7f5" stroke="#bbb"/>
  <text x="55" y="65" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#222">One selected network, two different access outcomes</text>
  <circle cx="285" cy="220" r="112" fill="#dce9e2" fill-opacity=".55" stroke="#4c8068" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="590" cy="220" r="112" fill="#dce9e2" fill-opacity=".55" stroke="#4c8068" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M285 220 L590 220" stroke="#777" stroke-width="3" stroke-dasharray="8 7"/>
  <path d="M285 220 L590 220" stroke="#555" stroke-width="0"/>
  <circle cx="285" cy="220" r="26" fill="#b65d43" stroke="#783c2c" stroke-width="3"/>
  <circle cx="590" cy="220" r="26" fill="#b65d43" stroke="#783c2c" stroke-width="3"/>
  <text x="285" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#222">F1</text>
  <text x="590" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#222">F2</text>
  <path d="M435 130 L285 205 M435 130 L590 205" stroke="#246a9a" stroke-width="4" fill="none"/>
  <path d="M760 315 L590 245" stroke="#246a9a" stroke-width="4" fill="none"/>
  <circle cx="435" cy="130" r="19" fill="#246a9a" stroke="#16496b" stroke-width="3"/>
  <circle cx="760" cy="315" r="19" fill="#246a9a" stroke="#16496b" stroke-width="3"/>
  <text x="435" y="96" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#222">D1 · two-cover</text>
  <text x="760" y="354" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#222">D2 · one-cover</text>
  <text x="55" y="365" font-family="Arial,sans-serif" font-size="16" fill="#555">Dashed circles: service-threshold catchments · Blue links: eligible demand–facility pairs</text>
</svg>
