<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
<title id="title">MEXCLP expected coverage from two units</title>
<desc id="desc">Two service units can reach one demand area. Each unit has busy probability q. Under independent availability, the chance at least one is available is one minus q squared.</desc>
<rect x="12" y="12" width="896" height="336" rx="18" fill="#f7f7f5" stroke="#777"/>
<circle cx="460" cy="180" r="118" fill="#d7e9f7" fill-opacity=".7" stroke="#3976a8" stroke-width="3" stroke-dasharray="8 7"/>
<rect x="110" y="80" width="130" height="70" rx="12" fill="#f0d6c7" stroke="#9b5837" stroke-width="3"/>
<text x="175" y="109" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#38251d">Unit 1</text>
<text x="175" y="132" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#38251d">busy: q</text>
<rect x="680" y="210" width="130" height="70" rx="12" fill="#f0d6c7" stroke="#9b5837" stroke-width="3"/>
<text x="745" y="239" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#38251d">Unit 2</text>
<text x="745" y="262" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#38251d">busy: q</text>
<circle cx="460" cy="180" r="34" fill="#fff" stroke="#245b37" stroke-width="4"/>
<text x="460" y="175" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173d26">Demand</text>
<text x="460" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#173d26">weight a</text>
<path d="M240 115 Q330 105 426 160" fill="none" stroke="#9b5837" stroke-width="3"/>
<path d="M680 245 Q560 255 488 205" fill="none" stroke="#9b5837" stroke-width="3"/>
<text x="460" y="326" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#222">Expected contribution = a (1 − q²), if both units are eligible</text>
</svg>