<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Convex hull around a set of points</title>
  <desc id="desc">A set of points on a coordinate plane. Five outer points are connected by a thick closed polygon to show the convex hull. Several smaller points inside the polygon are not hull vertices.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <path d="M100 60V450 M200 60V450 M300 60V450 M400 60V450 M500 60V450 M600 60V450 M700 60V450 M800 60V450"/>
    <path d="M70 100H830 M70 180H830 M70 260H830 M70 340H830 M70 420H830"/>
  </g>
  <g stroke="#374151" stroke-width="2" fill="none">
    <path d="M70 450H840 M70 450V45"/>
    <path d="M840 450l-12 -6v12z M70 45l-6 12h12z" fill="#374151"/>
  </g>
  <text x="850" y="455" font-family="Arial,sans-serif" font-size="18" fill="#374151">x</text>
  <text x="55" y="38" font-family="Arial,sans-serif" font-size="18" fill="#374151">y</text>
  <polygon points="190,390 610,390 740,250 610,100 190,100" fill="#c56b4b" fill-opacity="0.10" stroke="#b45336" stroke-width="7" stroke-linejoin="round"/>
  <g fill="#374151">
    <circle cx="350" cy="270" r="8"/><circle cx="430" cy="210" r="8"/><circle cx="510" cy="310" r="8"/>
    <circle cx="300" cy="180" r="8"/><circle cx="570" cy="170" r="8"/><circle cx="470" cy="360" r="8"/>
    <circle cx="380" cy="130" r="8"/>
  </g>
  <g fill="#b45336" stroke="#ffffff" stroke-width="3">
    <circle cx="190" cy="390" r="11"/><circle cx="610" cy="390" r="11"/><circle cx="740" cy="250" r="11"/>
    <circle cx="610" cy="100" r="11"/><circle cx="190" cy="100" r="11"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="21" fill="#111827">
    <text x="105" y="425">Hull vertex</text>
    <path d="M175 415L190 390" stroke="#111827" stroke-width="1.5" fill="none"/>
    <text x="420" y="245">Interior points</text>
    <path d="M420 250L430 210" stroke="#111827" stroke-width="1.5" fill="none"/>
    <text x="450" y="485" font-size="16" fill="#4b5563">The boundary encloses every point; interior points do not become hull corners.</text>
  </g>
</svg>
