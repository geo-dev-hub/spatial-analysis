<svg xmlns="http://www.w3.org/2000/svg" width="600" height="470" viewBox="0 0 600 470" role="img" aria-labelledby="t d">
<title id="t">D8 flow direction codes</title>
<desc id="d">A three by three cell grid. The centre cell is surrounded by eight arrows and direction codes: east one, southeast two, south four, southwest eight, west sixteen, northwest thirty-two, north sixty-four, northeast one hundred twenty-eight.</desc>
<rect width="600" height="470" fill="#fff"/>
<text x="300" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#222">Eight possible downslope directions</text>
<g stroke="#999" stroke-width="1.5" fill="#f6f6f6">
<rect x="105" y="70" width="130" height="100"/><rect x="235" y="70" width="130" height="100"/><rect x="365" y="70" width="130" height="100"/>
<rect x="105" y="170" width="130" height="100"/><rect x="235" y="170" width="130" height="100" fill="#e5eee9"/><rect x="365" y="170" width="130" height="100"/>
<rect x="105" y="270" width="130" height="100"/><rect x="235" y="270" width="130" height="100"/><rect x="365" y="270" width="130" height="100"/>
</g>
<g stroke="#267b68" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M300 220 L430 220 l-12 -8 m12 8 l-12 8"/>
<path d="M300 220 L430 320 l-16 -1 m16 1 l-5 -15"/>
<path d="M300 220 L300 350 l-8 -12 m8 12 l8 -12"/>
<path d="M300 220 L170 320 l16 -1 m-16 1 l5 -15"/>
<path d="M300 220 L170 220 l12 -8 m-12 8 l12 8"/>
<path d="M300 220 L170 120 l16 1 m-16 -1 l5 15"/>
<path d="M300 220 L300 90 l-8 12 m8 -12 l8 12"/>
<path d="M300 220 L430 120 l-16 1 m16 -1 l-5 15"/>
</g>
<circle cx="300" cy="220" r="9" fill="#222"/>
<g font-family="Arial,sans-serif" font-size="16" fill="#222" text-anchor="middle">
<text x="430" y="204">E · 1</text><text x="438" y="344">SE · 2</text><text x="300" y="400">S · 4</text><text x="160" y="344">SW · 8</text><text x="160" y="204">W · 16</text><text x="160" y="102">NW · 32</text><text x="300" y="66">N · 64</text><text x="440" y="102">NE · 128</text>
</g>
<text x="300" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#666">Direction codes identify the receiving neighbour of the centre cell.</text>
</svg>