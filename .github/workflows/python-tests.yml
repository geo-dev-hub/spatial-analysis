name: Python examples

concurrency:
  group: spatial-analysis-ci-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - "implementations/python/**"
      - "notebooks/**"
      - "scripts/**"
      - "**.md"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "implementations/python/**"
      - "notebooks/**"
      - "scripts/**"
      - "**.md"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: polygon-intersection
            directory: implementations/python/polygon-intersection
            pythonpath: ""
          - example: point-in-polygon
            directory: implementations/python/point-in-polygon
            pythonpath: ""
          - example: segment-intersection
            directory: implementations/python/segment-intersection
            pythonpath: ""
          - example: bentley-ottmann
            directory: implementations/python/bentley-ottmann
            pythonpath: "../segment-intersection"
          - example: global-morans-i
            directory: implementations/python/global-morans-i
            pythonpath: ""
          - example: geary-c
            directory: implementations/python/geary-c
            pythonpath: ""
          - example: str-packed-rtree
            directory: implementations/python/str-packed-rtree
            pythonpath: ""
          - example: spatial-join
            directory: implementations/python/spatial-join
            pythonpath: ""
          - example: kd-tree
            directory: implementations/python/kd-tree
            pythonpath: ""
          - example: quadtree
            directory: implementations/python/quadtree
            pythonpath: ""
          - example: polygon-validity
            directory: implementations/python/polygon-validity
            pythonpath: ""
          - example: polygon-clipping
            directory: implementations/python/polygon-clipping
            pythonpath: ""
          - example: polygon-overlay
            directory: implementations/python/polygon-overlay
            pythonpath: ""
          - example: convex-hull
            directory: implementations/python/convex-hull
            pythonpath: ""
          - example: voronoi-delaunay
            directory: implementations/python/voronoi-delaunay
            pythonpath: ""
          - example: line-simplification
            directory: implementations/python/line-simplification
            pythonpath: ""
          - example: polygon-offsetting
            directory: implementations/python/polygon-offsetting
            pythonpath: ""
          - example: proximity-graphs
            directory: implementations/python/proximity-graphs
            pythonpath: ""
          - example: shortest-paths
            directory: implementations/python/shortest-paths
            pythonpath: ""
          - example: point-location
            directory: implementations/python/point-location
            pythonpath: ""
          - example: coverage-simplification
            directory: implementations/python/coverage-simplification
            pythonpath: ""
          - example: precision-grid
            directory: implementations/python/precision-grid
            pythonpath: ""
          - example: road-routing
            directory: implementations/python/road-routing
            pythonpath: ""
          - example: geostatistics
            directory: implementations/python/geostatistics
            pythonpath: ""
          - example: raster-distance
            directory: implementations/python/raster-distance
            pythonpath: ""
          - example: spectral-indices
            directory: implementations/python/spectral-indices
            pythonpath: ""
          - example: p-median
            directory: implementations/python/p-median
            pythonpath: ""
          - example: dbscan
            directory: implementations/python/dbscan
            pythonpath: ""
          - example: two-step-fca
            directory: implementations/python/two-step-fca
            pythonpath: ""
          - example: d8-flow-accumulation
            directory: implementations/python/d8-flow-accumulation
            pythonpath: ""
          - example: d8-flow
            directory: implementations/python/d8-flow
            pythonpath: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.directory }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.directory }}
        env:
          PYTHONPATH: ${{ matrix.pythonpath }}
        run: python -m pytest -q

  links:
    name: Check internal links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check local Markdown and notebook links
        run: python scripts/check_internal_links.py

  notebooks:
    name: Execute learning notebooks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: notebooks/requirements.txt

      - name: Install notebook dependencies
        run: |
          python -m pip install -r notebooks/requirements.txt
          python -m pip install ipykernel nbconvert

      - name: Execute notebooks
        run: |
          python -m ipykernel install --user --name python3
          mkdir -p /tmp/notebook-output
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=120 notebooks/global-morans-i-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=120 notebooks/gearys-c-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/local-morans-i-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/local-geary-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/getis-ord-gi-star-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/global-getis-ord-g-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/str-packed-rtree-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/filter-refine-spatial-join-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/spatial-weights-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/geometry-foundations-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/quadtree-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/polygon-overlay-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/convex-hull-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/voronoi-delaunay-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/core-gis-algorithms-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/coverage-simplification-routing-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/geostatistics-interpolation-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/raster-distance-transform-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/ndvi-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/p-median-facility-location-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/dbscan-clustering-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/two-step-fca-accessibility-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/d8-flow-direction-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/d8-flow-accumulation-lab.ipynb

  clipper2:
    name: Clipper2 C# offset checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run Clipper2 offset checks
        run: dotnet run --project implementations/clipper2-csharp/Clipper2Example.csproj --configuration Release
