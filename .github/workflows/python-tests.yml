name: Python examples

on:
  push:
    paths:
      - "implementations/python/**"
      - "notebooks/**"
      - "scripts/**"
      - "**.md"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "implementations/python/**"
      - "notebooks/**"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: polygon-intersection
            directory: implementations/python/polygon-intersection
            pythonpath: ""
          - example: point-in-polygon
            directory: implementations/python/point-in-polygon
            pythonpath: ""
          - example: segment-intersection
            directory: implementations/python/segment-intersection
            pythonpath: ""
          - example: bentley-ottmann
            directory: implementations/python/bentley-ottmann
            pythonpath: "../segment-intersection"
          - example: global-morans-i
            directory: implementations/python/global-morans-i
            pythonpath: ""
          - example: geary-c
            directory: implementations/python/geary-c
            pythonpath: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.directory }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.directory }}
        env:
          PYTHONPATH: ${{ matrix.pythonpath }}
        run: python -m pytest -q

  links:
    name: Check internal links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check local Markdown and notebook links
        run: python scripts/check_internal_links.py

  notebooks:
    name: Execute learning notebooks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: notebooks/requirements.txt

      - name: Install notebook dependencies
        run: |
          python -m pip install -r notebooks/requirements.txt
          python -m pip install ipykernel nbconvert

      - name: Execute notebooks
        run: |
          python -m ipykernel install --user --name python3
          mkdir -p /tmp/notebook-output
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=120 notebooks/global-morans-i-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=120 notebooks/gearys-c-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/local-morans-i-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/local-geary-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/getis-ord-gi-star-lab.ipynb
          python -m nbconvert --to notebook --execute --output-dir /tmp/notebook-output --ExecutePreprocessor.timeout=180 notebooks/global-getis-ord-g-lab.ipynb
